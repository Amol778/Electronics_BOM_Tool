<!-- SECTION 4: BULK EXCEL BOM PARSER, EXECUTIVE SUMMARY & ENHANCED EXPORTER   -->
<!-- ========================================================================= -->
<script>
/**
 * Section 4: Bulk Excel BOM Engine, Executive Summary Table & Enhanced Exporter
 */
const BulkBomEngine = {
    state: {
        rawWorkbook: null,
        rawSheetRows: [],
        headerRowIdx: 0,
        originalHeaders: [],
        rawRowObjects: [],
        activeJobId: 0
    },

    // 1. Initialize Bulk BOM Workspace DOM
    init() {
        const mountPoint = document.getElementById('bomWorkspaceArea');
        if (!mountPoint) return;

        mountPoint.innerHTML = `
            <div class="crisp-panel">
                <div class="crisp-panel-header">
                    <span><i class="bi bi-file-earmark-spreadsheet-fill text-success me-2"></i>Option B: Bulk Project BOM Upload & Multi-Vendor Verification</span>
                    <span class="badge bg-success">Any Row Count (10 to 1,000+ Parts)</span>
                </div>
                <div class="crisp-panel-body">
                    <!-- Dropzone -->
                    <div class="p-4 border-2 border-dashed rounded text-center bg-light" 
                         style="border: 2px dashed var(--brand-primary) !important; cursor: pointer;"
                         onclick="document.getElementById('excelFileInput').click();">
                        <i class="bi bi-cloud-arrow-up-fill text-primary fs-1"></i>
                        <h6 class="fw-bold mt-2 mb-1">Drag & Drop or Click to Select BOM Spreadsheet</h6>
                        <p class="text-muted small mb-2">
                            Supports .xlsx, .xls, and .csv files. Automatically isolates <code>MFG_PN</code> & <code>MFG_NAME</code> across passive components, ICs, and MCUs.
                        </p>
                        <input type="file" id="excelFileInput" class="d-none" accept=".xlsx, .xls, .csv">
                        <button type="button" class="btn btn-sm btn-primary fw-bold px-3 shadow-sm">Browse File</button>
                    </div>

                    <div class="mt-3 p-2 rounded bg-light border d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small fw-bold text-dark" id="bomFileNameText">No file uploaded</div>
                            <div class="text-muted" style="font-size: 0.72rem;">Automatically skips title headers and identifies primary component columns</div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="BulkBomEngine.downloadDemoTemplate()">
                            <i class="bi bi-download me-1"></i> Sample Template (.xlsx)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Interactive DigiKey MyLists-Style Column Mapper -->
            <div id="bomMapperContainer" class="crisp-panel border-primary d-none my-3">
                <div class="crisp-panel-header bg-primary text-white">
                    <span><i class="bi bi-diagram-3-fill me-2"></i>Step 2: Confirm BOM Column Mapping (Auto-Matched)</span>
                    <span id="bomDetectedCountBadge" class="badge bg-white text-primary fw-bold">0 Rows Detected</span>
                </div>
                <div class="crisp-panel-body">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-2">
                            <label class="form-label-custom">Sheet Tab</label>
                            <select id="sheetPickerSelect" class="form-select-custom" onchange="BulkBomEngine.onSheetSelected()"></select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label-custom">Header Row</label>
                            <input type="number" id="headerRowInput" class="form-control-custom" min="1" max="50" value="1" onchange="BulkBomEngine.rebuildMapperSelectors()">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom text-danger fw-bold">MFG_PN (Part No) *</label>
                            <select id="selMapMpn" class="form-select-custom border-danger" onchange="BulkBomEngine.updatePreviewStrip()"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom text-primary fw-bold">MFG_NAME (Manufacturer)</label>
                            <select id="selMapMfr" class="form-select-custom border-primary" onchange="BulkBomEngine.updatePreviewStrip()"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom">Category / Type</label>
                            <select id="selMapType" class="form-select-custom" onchange="BulkBomEngine.updatePreviewStrip()"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom">Value / Comment</label>
                            <select id="selMapVal" class="form-select-custom" onchange="BulkBomEngine.updatePreviewStrip()"></select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label-custom">Tolerance</label>
                            <select id="selMapTol" class="form-select-custom"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom">Voltage Rating</label>
                            <select id="selMapVolt" class="form-select-custom"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom">Package / Footprint</label>
                            <select id="selMapPkg" class="form-select-custom" onchange="BulkBomEngine.updatePreviewStrip()"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label-custom">Description / Details</label>
                            <select id="selMapDesc" class="form-select-custom"></select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label-custom">Current / Power</label>
                            <select id="selMapCurr" class="form-select-custom"></select>
                        </div>
                        <div class="col-md-2">
                            <button id="btnExecuteBomAudit" class="btn btn-success btn-sm w-100 fw-bold py-2 shadow-sm" onclick="BulkBomEngine.executeAudit()">
                                <i class="bi bi-play-circle-fill me-1"></i> Run Bulk Verification
                            </button>
                        </div>
                    </div>

                    <!-- Live Mapping Preview Strip -->
                    <div id="bomLivePreviewBox" class="p-2 mt-3 rounded bg-dark text-white font-monospace" style="font-size: 0.76rem;"></div>

                    <!-- Paced Progress Indicator -->
                    <div id="bomProgressRow" class="mt-3 d-none">
                        <div class="d-flex justify-content-between small mb-1 fw-bold">
                            <span id="bomProgressStatus" class="text-primary">Querying Official Distributor APIs...</span>
                            <span id="bomProgressTally">0 / 0</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div id="bomProgressMeter" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        this.injectExecutiveSummarySlot();
        this.bindEvents();
    },

    // 2. Inject Executive Summary Box right above the results table
    injectExecutiveSummarySlot() {
        const resultsWrapper = document.getElementById('resultsCardWrapper');
        if (!resultsWrapper) return;

        // Create or replace summary container
        let summaryContainer = document.getElementById('bomExecutiveSummaryArea');
        if (!summaryContainer) {
            summaryContainer = document.createElement('div');
            summaryContainer.id = 'bomExecutiveSummaryArea';
            summaryContainer.className = 'd-none mb-3';
            resultsWrapper.parentNode.insertBefore(summaryContainer, resultsWrapper);
        }
    },

    // 3. Bind File Input Events
    bindEvents() {
        const fileInput = document.getElementById('excelFileInput');
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('bomFileNameText').innerText = `Active BOM: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = new Uint8Array(evt.target.result);
                this.state.rawWorkbook = XLSX.read(data, { type: 'array' });

                const sheetPicker = document.getElementById('sheetPickerSelect');
                sheetPicker.innerHTML = '';
                this.state.rawWorkbook.SheetNames.forEach((name, idx) => {
                    sheetPicker.innerHTML += `<option value="${idx}">${name}</option>`;
                });

                this.onSheetSelected();
            };
            reader.readAsArrayBuffer(file);
        });
    },

    // 4. Tab Ingestion & Automatic Header Row Detection
    onSheetSelected() {
        if (!this.state.rawWorkbook) return;
        const sheetIdx = parseInt(document.getElementById('sheetPickerSelect').value, 10) || 0;
        const sheetName = this.state.rawWorkbook.SheetNames[sheetIdx];
        const sheet = this.state.rawWorkbook.Sheets[sheetName];

        this.state.rawSheetRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });

        if (this.state.rawSheetRows.length === 0) {
            alert("The selected worksheet tab is empty.");
            return;
        }

        // Auto-locate Header Row (scans top 35 rows for MFG_PN / MPN / Part Number / MFG_NAME)
        let bestRow = 0;
        let highestScore = -1;

        for (let i = 0; i < Math.min(35, this.state.rawSheetRows.length); i++) {
            const row = this.state.rawSheetRows[i];
            if (!row) continue;
            let score = 0;
            row.forEach(cell => {
                const norm = String(cell || '').toUpperCase().replace(/[^A-Z0-9_]/g, '');
                if (norm === 'MFG_PN' || norm === 'MFGPN' || norm === 'MPN' || norm.includes('PARTNUMBER') || norm.includes('PARTNO')) score += 12;
                else if (norm === 'MFG_NAME' || norm === 'MFGNAME' || norm === 'MANUFACTURER' || norm === 'MFR') score += 10;
                else if (/VALUE|COMMENT|PACKAGE|FOOTPRINT|TOLERANCE|VOLTAGE|DESCRIPTION|DESC|QTY|REFDES/.test(norm)) score += 3;
            });
            if (score > highestScore) {
                highestScore = score;
                bestRow = i;
            }
        }

        this.state.headerRowIdx = bestRow;
        this.state.originalHeaders = this.state.rawSheetRows[bestRow] || [];
        
        document.getElementById('headerRowInput').value = bestRow + 1;
        document.getElementById('bomMapperContainer').classList.remove('d-none');
        this.rebuildMapperSelectors();
    },

    // 5. Populate Mapping Dropdowns & Strict Field Identification
    rebuildMapperSelectors() {
        const headerIdx = Math.max(0, parseInt(document.getElementById('headerRowInput').value, 10) - 1);
        this.state.headerRowIdx = headerIdx;
        const headerRow = this.state.rawSheetRows[headerIdx] || [];
        this.state.originalHeaders = headerRow;
        const firstDataRow = this.state.rawSheetRows[headerIdx + 1] || [];

        // Count non-empty parts
        let validRows = 0;
        for (let r = headerIdx + 1; r < this.state.rawSheetRows.length; r++) {
            if (this.state.rawSheetRows[r] && this.state.rawSheetRows[r].some(c => String(c).trim() !== "")) validRows++;
        }
        document.getElementById('bomDetectedCountBadge').innerText = `${validRows} Component Rows Detected`;

        const selects = ['selMapMpn', 'selMapMfr', 'selMapType', 'selMapVal', 'selMapTol', 'selMapVolt', 'selMapPkg', 'selMapDesc', 'selMapCurr'];
        selects.forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = `<option value="-1">-- Unmapped --</option>`;
            headerRow.forEach((colName, idx) => {
                const cleanName = String(colName || `Col ${idx + 1}`).trim();
                const previewSnippet = String(firstDataRow[idx] || '').trim();
                const previewText = previewSnippet ? ` (e.g., "${previewSnippet.slice(0, 16)}")` : '';
                el.innerHTML += `<option value="${idx}">${cleanName}${previewText}</option>`;
            });
        });

        // Smart Mapping Rules (Normalized)
        const normHeaders = headerRow.map(h => String(h || '').toUpperCase().replace(/[^A-Z0-9]/g, ''));

        const matchCol = (elId, exactNames, fallbackRegex, exclusionRegex = null) => {
            let idx = normHeaders.findIndex(nh => exactNames.includes(nh));
            if (idx === -1 && fallbackRegex) {
                idx = headerRow.findIndex(raw => {
                    const str = String(raw || '').trim();
                    if (!str) return false;
                    if (exclusionRegex && exclusionRegex.test(str)) return false;
                    return fallbackRegex.test(str);
                });
            }
            if (idx !== -1) document.getElementById(elId).value = idx;
        };

        matchCol('selMapMpn', ['MFGPN', 'MPN', 'MANUFACTURERPARTNUMBER', 'MFGPARTNUMBER', 'PARTNUMBER', 'PARTNO', 'PN'], /mfg[_\s-]*p\/?n|mpn|part[_\s-]*(number|no)|p\/n/i, /name|vendor|mfr_name/i);
        matchCol('selMapMfr', ['MFGNAME', 'MFRNAME', 'MANUFACTURER', 'MANUFACTURERNAME', 'MFG', 'MFR', 'VENDOR', 'BRAND'], /mfg[_\s-]*name|mfr[_\s-]*name|manufacturer|vendor|brand|^mfg$|^mfr$/i, /pn|part|number|no/i);
        matchCol('selMapType', ['CATEGORY', 'COMPONENTTYPE', 'TYPE', 'PARTTYPE'], /category|component[_\s-]*type|^type$/i);
        matchCol('selMapVal', ['VALUE', 'VAL', 'COMMENT', 'CAPACITANCE', 'RESISTANCE'], /^value$|^val$|comment|capacitance|resistance/i);
        matchCol('selMapTol', ['TOLERANCE', 'TOL'], /^tol|tolerance/i);
        matchCol('selMapVolt', ['VOLTAGE', 'VOLT', 'RATEDVOLTAGE', 'VDC'], /^volt|voltage|vdc/i);
        matchCol('selMapPkg', ['PACKAGE', 'FOOTPRINT', 'CASE', 'PCBFOOTPRINT', 'SIZE'], /package|footprint|case|size/i);
        matchCol('selMapDesc', ['DESCRIPTION', 'DESC', 'DETAILS', 'SPECIFICATION'], /^desc|description|detail|spec/i);
        matchCol('selMapCurr', ['CURRENT', 'POWER', 'WATTS'], /current|power|watt|amp/i);

        this.updatePreviewStrip();
    },

    // 6. Update Live Mapping Confirmation Strip
    updatePreviewStrip() {
        const headerIdx = Math.max(0, parseInt(document.getElementById('headerRowInput').value, 10) - 1);
        const mpnIdx = parseInt(document.getElementById('selMapMpn').value, 10);
        const mfrIdx = parseInt(document.getElementById('selMapMfr').value, 10);
        const valIdx = parseInt(document.getElementById('selMapVal').value, 10);
        const pkgIdx = parseInt(document.getElementById('selMapPkg').value, 10);

        const sample = [];
        for (let r = headerIdx + 1; r < this.state.rawSheetRows.length && sample.length < 2; r++) {
            const row = this.state.rawSheetRows[r];
            if (!row || row.every(c => String(c).trim() === "")) continue;
            sample.push({
                rowNum: r + 1,
                mpn: mpnIdx >= 0 ? String(row[mpnIdx] || '').trim() : "(Unmapped)",
                mfr: mfrIdx >= 0 ? String(row[mfrIdx] || '').trim() : "(Unmapped)",
                val: valIdx >= 0 ? String(row[valIdx] || '').trim() : "(Unmapped)",
                pkg: pkgIdx >= 0 ? String(row[pkgIdx] || '').trim() : "(Unmapped)"
            });
        }

        const box = document.getElementById('bomLivePreviewBox');
        if (sample.length === 0) {
            box.innerHTML = `<span class="text-danger fw-bold">⚠ No component data found below Header Row ${headerIdx + 1}. Adjust Header Row number.</span>`;
            return;
        }

        box.innerHTML = `<div class="text-warning fw-bold mb-1">✔ Auto-Captured Data Preview (Confirming Row Extraction):</div>` +
            sample.map(s => 
                `<div>Row ${s.rowNum} &rarr; <strong>MFG_PN:</strong> <code>${s.mpn || 'EMPTY'}</code> | <strong>MFG_NAME:</strong> <code>${s.mfr || '—'}</code> | <strong>Value:</strong> <code>${s.val || '—'}</code> | <strong>Package:</strong> <code>${s.pkg || '—'}</code></div>`
            ).join('');
    },

    // 7. Execute Batch Audit via Component Intelligence Agent
    async executeAudit() {
        const jobId = ++this.state.activeJobId;
        const headerIdx = Math.max(0, parseInt(document.getElementById('headerRowInput').value, 10) - 1);
        const getCol = (id) => parseInt(document.getElementById(id).value, 10);

        const mpnIdx = getCol('selMapMpn');
        const mfrIdx = getCol('selMapMfr');
        const typeIdx = getCol('selMapType');
        const valIdx = getCol('selMapVal');
        const tolIdx = getCol('selMapTol');
        const voltIdx = getCol('selMapVolt');
        const pkgIdx = getCol('selMapPkg');
        const descIdx = getCol('selMapDesc');
        const currIdx = getCol('selMapCurr');

        const queue = [];
        for (let r = headerIdx + 1; r < this.state.rawSheetRows.length; r++) {
            const row = this.state.rawSheetRows[r];
            if (!row || row.every(c => String(c).trim() === "")) continue;

            const mpn = mpnIdx >= 0 ? String(row[mpnIdx] || '').trim() : "";
            const mfr = mfrIdx >= 0 ? String(row[mfrIdx] || '').trim() : "";
            const val = valIdx >= 0 ? String(row[valIdx] || '').trim() : "";
            const desc = descIdx >= 0 ? String(row[descIdx] || '').trim() : "";

            if (!mpn && !val && !desc) continue;
            if (/^(dnp|do not populate|none|n\/a|-)$/i.test(mpn) && !val) continue;

            queue.push({
                rowNum: r + 1,
                originalRowData: row, // Keeps original row intact for export!
                mpn,
                mfr,
                type: typeIdx >= 0 ? String(row[typeIdx] || '').trim() : "",
                p1: val,
                p2: tolIdx >= 0 ? String(row[tolIdx] || '').trim() : "",
                p3: voltIdx >= 0 ? String(row[voltIdx] || '').trim() : "",
                package: pkgIdx >= 0 ? String(row[pkgIdx] || '').trim() : "",
                p5: currIdx >= 0 ? String(row[currIdx] || '').trim() : "",
                desc
            });
        }

        if (queue.length === 0) {
            alert("No valid component rows found to audit. Please confirm your column mapping.");
            return;
        }

        // Reset State
        ComponentAgent.state.auditRecords = [];
        const progressRow = document.getElementById('bomProgressRow');
        const meter = document.getElementById('bomProgressMeter');
        const tally = document.getElementById('bomProgressTally');
        progressRow.classList.remove('d-none');

        const tableWrapper = document.getElementById('resultsCardWrapper');
        tableWrapper.classList.remove('d-none');

        // Sequentially execute through Component Intelligence Agent
        for (let i = 0; i < queue.length; i++) {
            if (jobId !== this.state.activeJobId) return;

            const item = queue[i];
            tally.innerText = `${i + 1} / ${queue.length} Components`;
            meter.style.width = `${Math.round(((i + 1) / queue.length) * 100)}%`;

            const fetched = await ComponentAgent.inspectComponent(item);
            const evaluation = ComponentAgent.evaluateDiscrepancies(item, fetched);

            ComponentAgent.state.auditRecords.push({
                index: i + 1,
                originalRowData: item.originalRowData, // Retained for appending in export
                input: item,
                fetched: fetched,
                evaluation: evaluation,
                priceUsd: fetched.priceUsd,
                status: evaluation.status,
                alternates: fetched.alternates || []
            });

            // Stream results to table periodically
            if (i % 2 === 0 || i === queue.length - 1) {
                ComponentAgent.recalculateKPIs();
                ManualEntryUI.renderTable();
            }
        }

        if (jobId === this.state.activeJobId) {
            setTimeout(() => progressRow.classList.add('d-none'), 800);
            this.renderExecutiveSummary(ComponentAgent.state.auditRecords);
            document.getElementById('bomExecutiveSummaryArea').scrollIntoView({ behavior: 'smooth' });
        }
    },

    // 8. Render Critical BOM Executive Summary Card & Table
    renderExecutiveSummary(records) {
        const summaryArea = document.getElementById('bomExecutiveSummaryArea');
        if (!summaryArea) return;

        const total = records.length;
        const clean = records.filter(r => r.status === "Verified Clean").length;
        const mismatch = records.filter(r => r.status === "Mismatch Found").length;
        const notFound = records.filter(r => r.status === "Part Not Found").length;
        const healthScore = total > 0 ? Math.round((clean / total) * 100) : 0;

        // Categorize Risk Levels
        const highRiskItems = records.filter(r => r.status === "Part Not Found");
        const medRiskItems = records.filter(r => r.status === "Mismatch Found");

        let healthColor = healthScore >= 80 ? 'text-success' : (healthScore >= 50 ? 'text-warning' : 'text-danger');
        let healthBg = healthScore >= 80 ? 'bg-success' : (healthScore >= 50 ? 'bg-warning' : 'bg-danger');

        summaryArea.innerHTML = `
            <div class="crisp-panel border-dark shadow-sm">
                <div class="crisp-panel-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-speedometer2 text-warning me-2"></i>Executive BOM Parsing & Sourcing Health Summary</span>
                    <span class="badge ${healthBg}">BOM Health Score: ${healthScore}%</span>
                </div>
                <div class="crisp-panel-body">
                    <!-- Key Metric Badges -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-3">
                            <div class="p-2 border rounded bg-light text-center">
                                <div class="text-muted small fw-bold uppercase">Total BOM Entries</div>
                                <div class="fs-4 fw-bold text-dark font-monospace">${total}</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-2 border rounded bg-success bg-opacity-10 text-center border-success">
                                <div class="text-success small fw-bold uppercase">Verified Clean Parts</div>
                                <div class="fs-4 fw-bold text-success font-monospace">${clean} (${total > 0 ? Math.round((clean/total)*100) : 0}%)</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-2 border rounded bg-danger bg-opacity-10 text-center border-danger">
                                <div class="text-danger small fw-bold uppercase">Parameter Mismatches</div>
                                <div class="fs-4 fw-bold text-danger font-monospace">${mismatch} (${total > 0 ? Math.round((mismatch/total)*100) : 0}%)</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-2 border rounded bg-secondary bg-opacity-10 text-center border-secondary">
                                <div class="text-secondary small fw-bold uppercase">Unverified / Not Found</div>
                                <div class="fs-4 fw-bold text-dark font-monospace">${notFound} (${total > 0 ? Math.round((notFound/total)*100) : 0}%)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Critical Risk Summary Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm mb-0 align-middle" style="font-size:0.79rem;">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 140px;">Criticality Level</th>
                                    <th style="width: 90px;" class="text-center">Count</th>
                                    <th>Observed Critical Observations & Sourcing Impact</th>
                                    <th style="width: 220px;">Recommended Engineering Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <span class="badge bg-danger text-white"><i class="bi bi-x-octagon-fill me-1"></i>High Risk</span>
                                    </td>
                                    <td class="text-center fw-bold font-monospace">${highRiskItems.length}</td>
                                    <td>
                                        ${highRiskItems.length > 0 
                                            ? `Components like <code>${highRiskItems.slice(0, 3).map(x => x.fetched.mpn).join(', ')}</code> could not be found in active distributor catalogs or EIA databases. Risk of obsolete parts or invalid part numbers.`
                                            : `<span class="text-success fw-semibold">No critical unverified part numbers detected. All MPNs match active distributor catalogs.</span>`}
                                    </td>
                                    <td>
                                        ${highRiskItems.length > 0 
                                            ? `<span class="text-danger fw-bold">Manual engineering review required before fab release. Verify manufacturer spelling or part suffix.</span>`
                                            : `<span class="text-success">Ready for fabrication sourcing.</span>`}
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle-fill me-1"></i>Medium Risk</span>
                                    </td>
                                    <td class="text-center fw-bold font-monospace">${medRiskItems.length}</td>
                                    <td>
                                        ${medRiskItems.length > 0 
                                            ? `Parameter discrepancies found between engineering BOM and official distributor specs (e.g. package size differences like 0402 vs 0603, or voltage derating ratings).`
                                            : `<span class="text-success fw-semibold">Zero parameter discrepancies. Component footprints and electrical ratings match 1:1.</span>`}
                                    </td>
                                    <td>
                                        ${medRiskItems.length > 0 
                                            ? `<span class="text-warning-emphasis fw-bold">Review highlighted red cells in audit table below to verify PCB footprint matches schematic.</span>`
                                            : `<span class="text-success">No footprint correction needed.</span>`}
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <span class="badge bg-success text-white"><i class="bi bi-check-circle-fill me-1"></i>Second Source</span>
                                    </td>
                                    <td class="text-center fw-bold font-monospace">${records.filter(r => r.alternates && r.alternates.length > 0).length}</td>
                                    <td>
                                        Second-source cross-manufacturer replacement parts strictly verified and suggested from competing manufacturers (excluding the entered manufacturer to avoid vendor lock-in).
                                    </td>
                                    <td>
                                        <span class="text-success fw-bold">Approved for multi-vendor supply chain redundancy.</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Quick Action Bar -->
                    <div class="mt-3 d-flex justify-content-between align-items-center">
                        <small class="text-muted"><i class="bi bi-info-circle me-1"></i>Full row-by-row parameter comparison with working links is detailed in the table below.</small>
                        <button class="btn btn-sm btn-success fw-bold px-3 shadow-sm" onclick="BulkBomEngine.exportVerifiedBOM()">
                            <i class="bi bi-file-earmark-arrow-down-fill me-1"></i> Download Original BOM + Alternates (.xlsx)
                        </button>
                    </div>
                </div>
            </div>
        `;

        summaryArea.classList.remove('d-none');
    },

    // 9. Verified Multi-Vendor BOM Excel Exporter (Original BOM + Added Alternate Columns)
    exportVerifiedBOM() {
        const records = ComponentAgent.state.auditRecords;
        if (!records || records.length === 0) {
            alert("No audit records available to export.");
            return;
        }

        const curr = ComponentAgent.state.currency;
        const originalHeaders = this.state.originalHeaders;

        // Construct rows: 100% of Original BOM Columns PRESERVED + New Audit & Alternate Columns Added
        const exportRows = records.map(r => {
            const rowObj = {};
            const origRowData = r.originalRowData || [];

            // 1. Copy over every single original BOM cell exactly as uploaded
            originalHeaders.forEach((colName, colIdx) => {
                const headerKey = String(colName || `Column_${colIdx + 1}`).trim();
                rowObj[headerKey] = origRowData[colIdx] !== undefined ? origRowData[colIdx] : "";
            });

            const f = r.fetched;
            const alts = r.alternates || [];

            // 2. Append Verified Audit & Alternate Columns
            rowObj["[AUDIT] Status"] = r.status;
            rowObj["[AUDIT] Discrepancies / Mistakes"] = r.evaluation.mismatches.join("; ") || "None (100% Match)";
            rowObj[`[AUDIT] Unit Price (${curr})`] = ComponentAgent.currencyUtils.formatPrice(f.priceUsd);
            rowObj["[AUDIT] Verified Primary Source"] = f.primarySource;
            rowObj["[AUDIT] Official Information Link"] = f.productUrl || "N/A";

            // Alternate 1
            rowObj["Alternate 1: MFG_PN"] = alts[0] ? alts[0].mpn : "None";
            rowObj["Alternate 1: MFG_NAME"] = alts[0] ? alts[0].mfr : "None";
            rowObj["Alternate 1: Verified Specs"] = alts[0] ? alts[0].specs : "None";
            rowObj[`Alternate 1: Price (${curr})`] = alts[0] ? ComponentAgent.currencyUtils.formatPrice(alts[0].priceUsd) : "—";
            rowObj["Alternate 1: Link"] = alts[0] ? `https://www.digikey.in/en/products/result?keywords=${encodeURIComponent(alts[0].mpn)}` : "—";

            // Alternate 2
            rowObj["Alternate 2: MFG_PN"] = alts[1] ? alts[1].mpn : "None";
            rowObj["Alternate 2: MFG_NAME"] = alts[1] ? alts[1].mfr : "None";
            rowObj["Alternate 2: Verified Specs"] = alts[1] ? alts[1].specs : "None";
            rowObj[`Alternate 2: Price (${curr})`] = alts[1] ? ComponentAgent.currencyUtils.formatPrice(alts[1].priceUsd) : "—";
            rowObj["Alternate 2: Link"] = alts[1] ? `https://www.mouser.in/c/?q=${encodeURIComponent(alts[1].mpn)}` : "—";

            // Alternate 3
            rowObj["Alternate 3: MFG_PN"] = alts[2] ? alts[2].mpn : "None";
            rowObj["Alternate 3: MFG_NAME"] = alts[2] ? alts[2].mfr : "None";
            rowObj["Alternate 3: Verified Specs"] = alts[2] ? alts[2].specs : "None";
            rowObj[`Alternate 3: Price (${curr})`] = alts[2] ? ComponentAgent.currencyUtils.formatPrice(alts[2].priceUsd) : "—";
            rowObj["Alternate 3: Link"] = alts[2] ? (alts[2].lcscCode ? `https://www.lcsc.com/product-detail/${alts[2].lcscCode}.html` : `https://www.lcsc.com/search?q=${encodeURIComponent(alts[2].mpn)}`) : "—";

            return rowObj;
        });

        const ws = XLSX.utils.json_to_sheet(exportRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Verified_BOM_With_Alternates");
        XLSX.writeFile(wb, `Original_BOM_With_Verified_Alternates_${curr}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    },

    // 10. Download Sample BOM Template
    downloadDemoTemplate() {
        const sampleRows = [
            { "MFG_PN": "STM32F103C8T6", "MFG_NAME": "STMicroelectronics", "Category": "MCU", "Value": "72MHz", "Package": "LQFP-48", "Voltage": "3.3V", "Description": "32-Bit ARM Cortex-M3 MCU" },
            { "MFG_PN": "GRM188R71H104KA93D", "MFG_NAME": "Murata", "Category": "Capacitor", "Value": "100nF", "Package": "0603", "Voltage": "50V", "Description": "MLCC X7R 0603" },
            { "MFG_PN": "W25Q128JVSIQ", "MFG_NAME": "Winbond", "Category": "Memory", "Value": "128Mbit", "Package": "SOIC-8", "Voltage": "3.3V", "Description": "Quad-SPI NOR Flash" },
            { "MFG_PN": "AMS1117-3.3", "MFG_NAME": "Advanced Monolithic Systems", "Category": "Power", "Value": "3.3V", "Package": "SOT-223", "Voltage": "15V", "Description": "1A LDO Voltage Regulator" },
            { "MFG_PN": "BSS138", "MFG_NAME": "onsemi", "Category": "Discrete", "Value": "220mA", "Package": "SOT-23", "Voltage": "50V", "Description": "N-Channel Logic Level MOSFET" }
        ];
        const ws = XLSX.utils.json_to_sheet(sampleRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "BOM_Template");
        XLSX.writeFile(wb, "Hardware_Design_Guide_BOM_Template.xlsx");
    }
};

// Global Event Listeners for Export & Table Filter
window.addEventListener('exportBOM', () => {
    BulkBomEngine.exportVerifiedBOM();
});

window.addEventListener('filterTable', (e) => {
    const q = (e.detail || '').toLowerCase();
    const rows = document.querySelectorAll('#auditTableBody tr');
    rows.forEach(tr => {
        tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
});

// Auto-Initialize on Load
window.addEventListener('DOMContentLoaded', () => {
    BulkBomEngine.init();
});
</script>
